<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — SisLoc</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css"/>
  <style>
    body {display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,var(--bg-darkest) 0%,var(--bg-dark) 50%,var(--bg-surface) 100%)}
    .login-wrap{width:100%;max-width:420px;padding:20px}
    .login-card{background:var(--bg-card);border-radius:20px;box-shadow:0 8px 40px rgba(15,23,42,0.15),0 0 0 1px var(--bg-border-sub);overflow:hidden}
    .login-header{background:var(--neon-cyan);padding:40px 32px 30px;text-align:center;position:relative;overflow:hidden}
    .login-header::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle,rgba(255,255,255,0.1) 0%,transparent 60%)}
    .login-logo{width:60px;height:60px;border-radius:16px;background:#fff;display:inline-flex;align-items:center;justify-content:center;margin-bottom:16px;box-shadow:0 8px 24px var(--neon-cyan-glow)}
    .login-logo svg{width:28px;height:28px;color:var(--neon-cyan)}
    .login-title{font-size:22px;font-weight:700;color:#fff;margin-bottom:4px}
    .login-sub{font-size:13px;color:rgba(255,255,255,0.8)}
    .login-body{padding:32px}
    .fg{margin-bottom:20px}
    .fl{font-size:11px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.7px;margin-bottom:8px}
    .fi{width:100%;background:var(--bg-surface);border:1.5px solid var(--bg-border-sub);color:var(--text-1);padding:14px 16px;border-radius:12px;font-family:'Inter',sans-serif;font-size:14px;outline:none;transition:border-color .2s,box-shadow .2s}
    .fi:focus{border-color:var(--neon-cyan);box-shadow:0 0 0 3px var(--neon-cyan-glow)}
    .fi::placeholder{color:var(--text-4)}
    .login-options{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
    .remember-me{display:flex;align-items:center;gap:8px;cursor:pointer}
    .remember-me input{display:none}
    .remember-check{width:18px;height:18px;border-radius:5px;background:var(--bg-surface);border:1.5px solid var(--bg-border);display:flex;align-items:center;justify-content:center;transition:all .2s}
    .remember-me input:checked + .remember-check{background:var(--neon-cyan);border-color:var(--neon-cyan)}
    .remember-check svg{width:12px;height:12px;color:#fff;opacity:0;transition:opacity .2s}
    .remember-me input:checked + .remember-check svg{opacity:1}
    .remember-lbl{font-size:13px;color:var(--text-2)}
    .forgot-link{font-size:13px;color:var(--neon-cyan);text-decoration:none;font-weight:500;transition:color .15s}
    .forgot-link:hover{color:var(--neon-blue)}
    .btn-login{width:100%;padding:15px;border-radius:12px;background:var(--neon-cyan);color:#fff;border:none;font-size:15px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;box-shadow:0 4px 20px var(--neon-cyan-glow);transition:all .2s}
    .btn-login:hover{transform:translateY(-2px);box-shadow:0 8px 28px var(--neon-cyan-glow)}
    .btn-login:active{transform:translateY(0)}
    .login-divider{display:flex;align-items:center;gap:16px;margin:24px 0}
    .login-divider::before,.login-divider::after{content:'';flex:1;height:1px;background:var(--bg-border-sub)}
    .login-divider span{font-size:12px;color:var(--text-4);font-weight:500}
    .social-login{display:flex;gap:12px}
    .social-btn{flex:1;padding:12px;border-radius:12px;background:var(--bg-surface);border:1.5px solid var(--bg-border-sub);color:var(--text-2);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .15s;font-size:13px;font-weight:500;font-family:'Inter',sans-serif}
    .social-btn:hover{background:var(--bg-hover);border-color:var(--bg-border)}
    .social-btn svg{width:18px;height:18px}
    .login-footer{text-align:center;padding:0 32px 28px;font-size:13px;color:var(--text-3)}
    .login-footer a{color:var(--neon-cyan);text-decoration:none;font-weight:600}
    .login-footer a:hover{text-decoration:underline}
    @keyframes shake{
      0%,100%{transform:translateX(0)}
      10%,30%,50%,70%,90%{transform:translateX(-6px)}
      20%,40%,60%,80%{transform:translateX(6px)}
    }
    .shake{animation:shake .5s ease-in-out}
  </style>
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <div class="login-header">
      <div class="login-logo">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0H5m5-4h4"/>
        </svg>
      </div>
      <div class="login-title">Bem-vindo</div>
      <div class="login-sub">Entre com suas credenciais</div>
    </div>
    <div class="login-body">
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="fg">
          <div class="fl">Email</div>
          <input class="fi" type="email" id="email" placeholder="seu@email.com" required/>
        </div>
        <div class="fg">
          <div class="fl">Senha</div>
          <input class="fi" type="password" id="password" placeholder="••••••••" required/>
        </div>
        <div class="login-options">
          <label class="remember-me">
            <input type="checkbox" id="remember"/>
            <div class="remember-check">
              <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
              </svg>
            </div>
            <span class="remember-lbl">Lembrar-me</span>
          </label>
          <a href="#" class="forgot-link">Esqueceu a senha?</a>
        </div>
        <button type="submit" class="btn-login">Entrar</button>
      </form>
      <div class="login-divider"><span>ou</span></div>
      <div class="social-login">
        <button type="button" class="social-btn">
          <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Google
        </button>
        <button type="button" class="social-btn">
          <svg viewBox="0 0 24 24" fill="#1877F2"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
          Facebook
        </button>
      </div>
    </div>
    <div class="login-footer">
      Não tem conta? <a href="#">Cadastre-se</a>
    </div>
  </div>
</div>

<script>
  function handleLogin(e) {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    
    if(email && password) {
      const btn = document.querySelector('.btn-login');
      btn.innerHTML = '<svg style="width:18px;height:18px;animation:spin 1s linear infinite" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg> Entrando...';
      btn.style.opacity = '0.8';
      
      setTimeout(() => {
        btn.innerHTML = 'Entrar';
        btn.style.opacity = '1';
        document.getElementById('loginForm').classList.add('shake');
        setTimeout(() => document.getElementById('loginForm').classList.remove('shake'), 500);
      }, 1500);
    }
  }
</script>

<style>
  @keyframes spin{to{transform:rotate(360deg)}}
</style>

</body>
</html>
